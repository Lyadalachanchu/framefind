name: Bug report
description: Report something that does not work as expected.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve FrameFind. Remove API keys and private media from reports. For security vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a short public sample or generated fixture if useful. Only share media you have permission to share.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Operating system, Python and FFmpeg versions, browser, and FrameFind commit. For video issues, include duration, format, and source type (upload, direct URL, or YouTube)."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Logs or screenshots
      description: Optional. Check that logs and screenshots contain no credentials or personal information.
